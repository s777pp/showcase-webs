# Production-oriented stack for SteamShowcase
# Usage: cp .env.example .env && docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-showcase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-showcase_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-showcase}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema_pg.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-showcase}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      # app and worker share the appdata volume here, so an external worker is safe.
      # If the worker container is down the API automatically falls back to embedded.
      WORKER_MODE: external
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      MAX_JOBS_PER_USER: ${MAX_JOBS_PER_USER:-2}
      FREE_LIMIT: ${FREE_LIMIT:-5}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-40}
      APP_URL: ${APP_URL:-http://localhost}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [internal]
    # exposed only via nginx
    expose:
      - "8080"
    healthcheck:
      # /api/health also probes PostgreSQL, Redis and R2, so an unhealthy app
      # means a dependency is down, not just a dead process.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "worker.py"]
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      WORKER_MODE: external
      MAX_JOB_WORKERS: ${MAX_JOB_WORKERS:-2}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-40}
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Loopback only: traffic arrives through the Cloudflare tunnel, which reaches
      # nginx over the internal network. Publishing on 0.0.0.0 would let anyone who
      # learns the VPS IP bypass Cloudflare (WAF, rate limits, bot rules) entirely.
      # Set HTTP_BIND=0.0.0.0 in .env only if you deliberately want direct access.
      # HTTP_PORT must be a bare port number here; older .env files folded the
      # address into it ("127.0.0.1:8080"), which now yields an invalid spec.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/var/www/static:ro
    depends_on:
      - app
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - nginx
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  appdata:

networks:
  internal:
    driver: bridge
