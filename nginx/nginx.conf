worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    # Character posts two files at once, each up to MAX_UPLOAD_MB (default 40),
    # so the request body ceiling has to clear 2x that plus multipart overhead.
    client_max_body_size 100m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1024;

    # security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    upstream app_upstream {
        server app:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Immutable-ish static (short cache; put long cache behind Cloudflare with versioned URLs)
        location /static/ {
            alias /var/www/static/;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri @app;
        }

        location /fonts/ {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 30d;
        }

        # Never cache API
        location /api/ {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location @app {
            proxy_pass http://app_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
