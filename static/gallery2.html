<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0c0c0c;--border:rgba(255,255,255,.1);--muted:rgba(255,255,255,.55);--ok:#28c840;--err:#ff5f57}
*{box-sizing:border-box}body{margin:0;font-family:Mulish,system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:28px 20px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:16px 0 8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.03);position:relative}
.card img.shot{width:100%;aspect-ratio:auto;max-height:none;object-fit:contain;display:block;background:#0a0a0a;min-height:200px}
.meta{padding:12px 14px;font-size:13px}
.meta b{display:block;margin-bottom:8px}
.author{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.author img,.author .ph{
  width:28px;height:28px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);
  border:1px solid var(--border);flex-shrink:0
}
.author .ph{display:grid;place-items:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
.actions{display:flex;gap:8px;padding:0 14px 14px}
.btn{border:none;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}
.btn.ok{background:var(--ok);color:#000}
.btn.err{background:var(--err);color:#fff}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
a.back{color:var(--muted);font-size:13px;text-decoration:none}
a.back:hover{color:#fff}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px}
.tabs button.active{background:rgba(255,255,255,.1);color:#fff}
.admin-badge{font-size:11px;color:#00d2ff;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Home</a> · <a class="back" href="/app">Tools</a>
  <h1>Публичная галерея <span class="admin-badge" id="adminBadge" style="display:none">admin</span></h1>
  <p class="sub">Витрины пользователей публикуются сразу. Админ может удалить любую работу.</p>
  <div class="tabs" id="tabs">
    <button type="button" class="active" data-tab="approved">Все работы</button>
  </div>
  <div class="grid" id="grid"><div class="empty">Загрузка…</div></div>
</div>
<script>
const headers = () => {
  const h = {};
  const s = localStorage.getItem('sm_session') || '';
  if (s) h['X-Session-Token'] = s;
  return h;
};
let isAdmin = false;

function esc(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function checkAdmin(){
  try {
    const r = await fetch('/api/gallery/am_admin', { credentials:'include', headers: headers() });
    const d = await r.json();
    isAdmin = !!d.admin;
    if (isAdmin) {
      document.getElementById('adminBadge').style.display = 'inline';
    }
  } catch(e){}
}

async function load(){
  const g = document.getElementById('grid');
  g.innerHTML = '<div class="empty">Загрузка…</div>';
  try {
    const r = await fetch('/api/gallery/list?status=approved&limit=60', { credentials:'include', headers: headers() });
    const d = await r.json();
    if (!r.ok) { g.innerHTML = '<div class="empty">'+(d.msg||'Ошибка')+'</div>'; return; }
    const items = d.items || [];
    if (!items.length) { g.innerHTML = '<div class="empty">Пока пусто — опубликуй первую витрину из Tools</div>'; return; }
    g.innerHTML = '';
    items.forEach(it => {
      const id = it.id;
      const title = it.title || it.mode || 'Showcase';
      const author = it.author || 'anon';
      const imgUrl = it.url || ('/api/gallery/image/' + id);
      const av = it.avatar_url || '';
      const initial = (author || '?').trim().charAt(0).toUpperCase();
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        `<a href="${imgUrl}" target="_blank" rel="noopener"><img class="shot" src="${imgUrl}" alt="" loading="lazy"/></a>
         <div class="meta">
           <b>${esc(title)}</b>
           <div class="author">
             ${av
               ? `<img src="${esc(av)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/>
                  <span class="ph" style="display:none">${esc(initial)}</span>`
               : `<span class="ph">${esc(initial)}</span>`}
             <span>${esc(author)}</span>
           </div>
         </div>`;
      if (isAdmin) {
        const act = document.createElement('div');
        act.className = 'actions';
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn err';
        del.textContent = 'Удалить';
        del.onclick = async () => {
          if (!confirm('Удалить эту работу из галереи?')) return;
          const rr = await fetch('/api/gallery/delete/' + id, {
            method: 'POST',
            credentials: 'include',
            headers: headers()
          });
          const dd = await rr.json().catch(()=>({}));
          if (!rr.ok || !dd.ok) {
            alert(dd.msg || 'Delete failed');
            return;
          }
          el.remove();
        };
        act.appendChild(del);
        el.appendChild(act);
      }
      g.appendChild(el);
    });
  } catch (e) {
    g.innerHTML = '<div class="empty">'+esc(String(e))+'</div>';
  }
}

checkAdmin().then(load);
</script>
</body>
</html>
