<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль — Showcase Maker</title><link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/ss.css?v=20260902a"><link rel="stylesheet" href="/static/steam-mockup/motiva_sans.css"><link rel="stylesheet" href="/static/steam-mockup/steam_profile.css"><link rel="stylesheet" href="/static/steam-mockup/builder.css?v=20260902a">
<style>html,body{margin:0;min-height:100%;background:#000}.public-wrap{position:relative;min-height:calc(100vh - 72px);background:#000}.public-wrap .sm-stage{min-height:calc(100vh - 72px);overflow:visible}.public-wrap .profile_page{padding-top:38px;min-height:calc(100vh - 72px)}.public-state{display:grid;place-items:center;min-height:65vh;color:#8f98a0;font:14px "Motiva Sans",sans-serif}.owner-edit{position:fixed;right:22px;bottom:22px;z-index:20;padding:10px 15px;border-radius:4px;background:linear-gradient(90deg,#47bfff,#2d74ff);color:#fff;text-decoration:none;font:600 12px "Motiva Sans",sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.4)}.public-wrap .sm-media-slot{pointer-events:none}.public-wrap .sm-media-slot__action{display:none}</style></head>
<body><div id="ssHeadHost"></div><main class="public-wrap"><div class="sm-stage" id="publicStage"><div class="public-state">Загрузка профиля…</div></div><a class="owner-edit" id="editLink" href="/profile" hidden>Редактировать профиль</a></main><div id="ssFootHost"></div>
<script src="/static/ss-shell.js?v=20260903003535"></script><script src="/static/js/steam-mockup.js?v=20260902a"></script><script>
(function(){var stage=document.getElementById('publicStage'),m=location.pathname.match(/^\/profile\/([^/]+)\/?$/i),name=m?decodeURIComponent(m[1]):'';if(!name){stage.innerHTML='<div class="public-state">Профиль не найден</div>';return}fetch('/api/profile/'+encodeURIComponent(name),{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw Error(d.msg||'Профиль не найден');var p=d.profile||{},state=p.snapshot;if(!state&&p.steam)state=SteamMockup.applySteamProfile(p.steam,SteamMockup.defaultState());if(!state){state=SteamMockup.defaultState();state.name=p.display_name||p.username||name;state.summary=p.profile_summary||'';state.level=p.profile_level||1;state.avatar=p.avatar_url||'';state.background=p.background_url||''}SteamMockup.render(state,stage);document.title=(state.name||name)+' — Showcase Maker';document.getElementById('editLink').hidden=!d.is_owner}).catch(function(e){stage.innerHTML='<div class="public-state">'+SteamMockup.esc(e.message)+'</div>'})})();
</script></body></html>
