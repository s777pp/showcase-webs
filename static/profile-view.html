<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Profile — Showcase Maker</title>
<link rel="icon" href="/static/icon.png"/>
<link rel="stylesheet" href="/static/ss.css"/>
<link rel="stylesheet" href="/static/steam-mockup/steam_profile.css"/>
<link rel="stylesheet" href="/static/steam-mockup/builder.css"/>
</head>
<body class="is-public">
<div id="ss-root"></div>
<main class="sm-stage is-public">
  <div id="mockupRoot"></div>
  <p id="ppMsg" style="text-align:center;color:rgba(255,255,255,.45);padding:40px">Загрузка…</p>
</main>
<script src="/static/ss-shell.js" defer></script>
<script src="/static/js/steam-mockup.js"></script>
<script>
(function () {
  var m = location.pathname.match(/^\/profile\/([^\/]+)\/?$/i);
  var uname = m ? decodeURIComponent(m[1]) : '';
  var root = document.getElementById('mockupRoot');
  var msg = document.getElementById('ppMsg');
  if (!uname) { msg.textContent = 'Профиль не указан'; return; }
  fetch('/api/profile/' + encodeURIComponent(uname), { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) { msg.textContent = (d && d.msg) || 'Не найден'; return; }
      msg.hidden = true;
      var p = d.profile || {};
      var S = SteamMockup.defaultState();
      if (p.display_name) S.name = p.display_name;
      if (p.profile_summary) S.summary = p.profile_summary;
      if (p.profile_level) S.level = p.profile_level;
      if (p.avatar_url) S.avatar = p.avatar_url;
      if (p.background_url) S.background = p.background_url;
      if (p.steam) {
        S = SteamMockup.applySteamProfile(p.steam, S);
        if (p.steam.background_movie) S.backgroundMovie = p.steam.background_movie;
        if (p.steam.background) S.background = p.steam.background;
        if (p.steam.frame) S.frame = p.steam.frame;
      }
      SteamMockup.render(S, root);
      document.title = (S.name || uname) + ' — Showcase Maker';
    })
    .catch(function (e) { msg.textContent = String(e); });
})();
</script>
</body>
</html>
