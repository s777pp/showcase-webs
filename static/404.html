  <style>
    /* Page not found (2026-10-07): any unknown site address (not /api, not /static) lands here
       instead of the raw JSON {"detail":"Not Found"}. */
    .nf{display:grid;place-items:center;min-height:calc(100dvh - 260px);padding:56px var(--site-gutter,16px) 72px;text-align:center}
    .nf__card{position:relative;width:min(640px,100%);padding:40px 32px 34px;border:1px solid rgba(110,170,255,.22);border-radius:22px;overflow:hidden;
      background:radial-gradient(90% 80% at 0% 0%,rgba(31,201,241,.12),transparent 60%),radial-gradient(90% 80% at 100% 100%,rgba(138,125,255,.14),transparent 60%),linear-gradient(180deg,#0e1a3c,#050a1c);
      box-shadow:0 30px 80px rgba(0,0,0,.45);font-family:Montserrat,system-ui,sans-serif;color:#e9f3ff}
    .nf__card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,#1fc9f1,#8a7dff)}
    .nf__code{margin:0;font:900 clamp(72px,16vw,128px)/1 Montserrat,system-ui,sans-serif!important;letter-spacing:-.04em;
      background:linear-gradient(90deg,#6fe3ff,#8a7dff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .nf__parts{display:flex;justify-content:center;gap:5px;margin:18px auto 22px}
    .nf__parts i{width:34px;height:52px;border-radius:5px;border:1px solid rgba(111,227,255,.35);background:rgba(31,201,241,.08)}
    .nf__parts i:nth-child(3){border-style:dashed;background:transparent;opacity:.6}
    .nf h1{margin:0 0 10px;font-size:clamp(22px,4vw,28px);font-weight:800;line-height:1.25;color:#fff}
    .nf p{margin:0 auto;max-width:460px;font-size:15px;line-height:1.6;color:rgba(214,229,250,.75)}
    .nf__actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:26px}
    .nf__actions a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:12px;font:800 14px/1 Montserrat,system-ui,sans-serif;text-decoration:none}
    .nf__go{background:linear-gradient(90deg,#1fc9f1,#8a7dff);color:#041019!important;box-shadow:0 10px 28px rgba(31,201,241,.22)}
    .nf__alt{border:1px solid rgba(110,170,255,.3);background:rgba(5,10,28,.6);color:#e9f3ff!important}
    .nf__alt:hover{border-color:#1fc9f1}
    @media (max-width:480px){.nf__card{padding:30px 18px 26px}.nf__actions a{flex:1 1 100%}}
  </style>
</head>
<body class="site-v2 page-notfound">
  <div id="ssHeadHost"></div>
  <main class="nf">
    <section class="nf__card" aria-labelledby="nfTitle">
      <div class="nf__code" aria-hidden="true">404</div>
      <div class="nf__parts" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1 id="nfTitle" data-nf="title">This page does not exist</h1>
      <p data-nf="text">The link may be old or mistyped. Everything else is where it was: pick where to go next.</p>
      <div class="nf__actions">
        <a class="nf__go" data-nf="tools" data-nf-href="/app" href="/app">Open the tools</a>
        <a class="nf__alt" data-nf="home" data-nf-href="/" href="/">Home page</a>
        <a class="nf__alt" data-nf="gallery" data-nf-href="/gallery" href="/gallery">Gallery</a>
      </div>
    </section>
  </main>
  <div id="ssFootHost"></div>
  <script>
    (function () {
      var COPY = {
        en: { title: 'This page does not exist', text: 'The link may be old or mistyped. Everything else is where it was: pick where to go next.', tools: 'Open the tools', home: 'Home page', gallery: 'Gallery' },
        ru: { title: 'Такой страницы нет', text: 'Возможно, ссылка устарела или в ней опечатка. Всё остальное на месте — выбери, куда перейти.', tools: 'Открыть инструменты', home: 'На главную', gallery: 'Галерея' },
        de: { title: 'Diese Seite gibt es nicht', text: 'Der Link ist vielleicht alt oder vertippt. Alles andere ist an seinem Platz – wähle, wohin es weitergeht.', tools: 'Werkzeuge öffnen', home: 'Startseite', gallery: 'Galerie' },
        tr: { title: 'Böyle bir sayfa yok', text: 'Bağlantı eski ya da hatalı yazılmış olabilir. Geri kalan her şey yerinde: nereye gideceğini seç.', tools: 'Araçları aç', home: 'Ana sayfa', gallery: 'Galeri' },
        fr: { title: 'Cette page n’existe pas', text: 'Le lien est peut-être ancien ou mal saisi. Tout le reste est à sa place : choisissez où aller.', tools: 'Ouvrir les outils', home: 'Accueil', gallery: 'Galerie' },
        uk: { title: 'Такої сторінки немає', text: 'Можливо, посилання застаріло або в ньому помилка. Усе інше на місці — обери, куди перейти.', tools: 'Відкрити інструменти', home: 'На головну', gallery: 'Галерея' },
        es: { title: 'Esta página no existe', text: 'Puede que el enlace sea antiguo o tenga una errata. Todo lo demás sigue en su sitio: elige adónde ir.', tools: 'Abrir las herramientas', home: 'Inicio', gallery: 'Galería' },
        pt: { title: 'Esta página não existe', text: 'O link pode estar antigo ou com erro de digitação. O resto continua no lugar: escolha para onde ir.', tools: 'Abrir as ferramentas', home: 'Página inicial', gallery: 'Galeria' }
      };
      var lang = (document.documentElement.lang || 'en').slice(0, 2);
      var c = COPY[lang] || COPY.en;
      document.title = c.title + ' · Showcase Maker';
      document.querySelectorAll('[data-nf]').forEach(function (el) {
        var key = el.getAttribute('data-nf');
        if (c[key]) el.textContent = c[key];
        var href = el.getAttribute('data-nf-href');
        if (href) el.setAttribute('href', '/' + (COPY[lang] ? lang : 'en') + (href === '/' ? '/' : href));
      });
    })();
  </script>
  <script src="/static/js/analytics.js?v=20261007-ux1"></script>
  <script src="/static/ss-shell.js?v=20261007-online1"></script>
