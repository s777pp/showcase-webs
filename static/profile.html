<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Редактор Steam-профиля — Showcase Maker</title><link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/ss.css?v=20260901f"><link rel="stylesheet" href="/static/steam-mockup/motiva_sans.css"><link rel="stylesheet" href="/static/steam-mockup/steam_profile.css"><link rel="stylesheet" href="/static/steam-mockup/builder.css?v=20260901f">
<style>
:root{--ink:#d6d7d8;--muted:#83909a;--line:rgba(255,255,255,.1);--blue:#66c0f4;--panel:#171a21}body{background:radial-gradient(circle at 70% 12%,rgba(55,112,150,.18),transparent 35%),#0d141d!important;color:var(--ink)}
.editor{width:min(1560px,calc(100% - 28px));margin:26px auto 70px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}.controls{position:sticky;top:88px;max-height:calc(100vh - 106px);overflow:auto;padding:14px;background:rgba(18,25,34,.92);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.controls h1{font:500 22px/1.2 "Motiva Sans",sans-serif;color:#fff;margin:2px 0 5px}.lead{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 16px}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-of-type{border-top:0}.section h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}.field{display:block;margin:9px 0}.field span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:5px;background:rgba(0,0,0,.3);color:#fff;font:13px "Motiva Sans",sans-serif}.input:focus{outline:2px solid rgba(102,192,244,.25);border-color:var(--blue)}textarea.input{min-height:76px;resize:vertical}.row{display:flex;gap:7px;align-items:center}.row>.input{flex:1}.btn{border:0;border-radius:4px;padding:9px 13px;background:linear-gradient(90deg,#47bfff,#2d74ff);color:#fff;font:600 12px "Motiva Sans",sans-serif;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.12)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.status{min-height:16px;margin:8px 0 0;font-size:11px;line-height:1.45;color:var(--muted)}.status.ok{color:#a4d007}.status.bad{color:#ff8080}.status.wait{color:#f3c969}.tabs{display:flex;gap:5px;margin-bottom:10px}.tabs button{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:11px}.tabs button.on{color:#fff;border-color:rgba(102,192,244,.5);background:rgba(102,192,244,.1)}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.asset{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#0b1016;cursor:pointer}.asset img,.asset video{width:100%;height:100%;object-fit:cover}.asset:hover{border-color:var(--blue)}
.sc-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:5px;margin-top:6px;font-size:12px}.sc-row button{color:var(--muted)}.preview-shell{min-width:0;background:rgba(8,13,19,.76);border:1px solid var(--line);border-radius:14px;overflow:hidden}.preview-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.preview-bar strong{color:#fff;font-weight:500}.preview-bar .spacer{flex:1}.sm-stage{height:calc(100vh - 124px);min-height:680px}.sm-stage .profile_page{min-height:100%;padding-top:30px}.savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.savebar .status{flex:1;min-width:160px;margin:0}
@media(max-width:1050px){.editor{grid-template-columns:1fr}.controls{position:static;max-height:none}.sm-stage{height:auto;min-height:800px}}@media(max-width:620px){.editor{width:calc(100% - 12px);margin-top:12px}.controls{padding:11px}.catalog{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="ssHeadHost"></div><main class="editor"><aside class="controls ss-scroll"><h1>Steam Profile</h1><p class="lead">Импортируй профиль Steam или собери оформление вручную. Клик по любой картинке в превью заменяет её.</p>
<section class="section"><h2>Импорт из Steam</h2><div class="row"><input class="input" id="steamUrl" placeholder="steamcommunity.com/id/..."><button class="btn" id="importBtn">Импорт</button></div><p class="status" id="importState"></p></section>
<section class="section"><h2>Профиль</h2><label class="field"><span>Ник</span><input class="input" id="name"></label><div class="row"><label class="field" style="flex:1"><span>Уровень</span><input class="input" id="level" type="number" min="0"></label><label class="field" style="flex:2"><span>Статус</span><select class="input" id="status"><option>Currently Offline</option><option>Currently Online</option><option>Currently In-Game</option></select></label></div><label class="field"><span>Описание</span><textarea class="input" id="summary"></textarea></label></section>
<section class="section"><h2>Оформление</h2><div class="tabs" id="assetTabs"><button class="on" data-asset="background">Фоны</button><button data-asset="avatar">Аватары</button><button data-asset="frame">Рамки</button></div><div class="row"><input class="input" id="assetSearch" placeholder="Поиск"><select class="input" id="assetKind" style="max-width:105px"><option value="all">Все</option><option value="static">Static</option><option value="animated">Animated</option></select></div><div class="catalog" id="catalog"></div><button class="btn ghost" id="moreAssets" style="width:100%;margin-top:8px">Показать ещё</button></section>
<section class="section"><h2>Витрины</h2><div id="showcaseList"></div><div class="row" style="margin-top:8px"><select class="input" id="newType"><option value="artwork">Artwork</option><option value="featured">Featured Artwork</option><option value="split">Artwork Split 506+100</option><option value="workshop">Workshop</option><option value="guide">Favorite Guide</option><option value="info">Info</option><option value="artfav">Favorite Artwork</option></select><button class="btn ghost" id="addShowcase">Добавить</button></div></section>
<section class="section savebar"><button class="btn" id="saveBtn">Сохранить профиль</button><a class="btn ghost" id="publicLink" hidden>Открыть публичный</a><p class="status" id="saveState"></p></section></aside>
<section class="preview-shell"><div class="preview-bar"><strong>Живой профиль</strong><span>Steam layout · 952 px</span><span class="spacer"></span><button class="btn ghost" id="topBtn">Наверх</button></div><div class="sm-stage ss-scroll" id="profileStage"></div></section></main><input id="mediaInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/webm,video/mp4" hidden><div id="ssFootHost"></div>
<script src="/static/ss-shell.js?v=20260901f"></script><script src="/static/js/steam-mockup.js?v=20260901f"></script><script>
(function(){'use strict';var state=SteamMockup.defaultState(),stage=document.getElementById('profileStage'),pending=null,asset='background',page=0,draftKey='sm_profile_draft:guest';function $(id){return document.getElementById(id)}function render(){SteamMockup.render(state,stage);paintShowcases()}function setStatus(id,text,kind){var e=$(id);e.textContent=text||'';e.className='status '+(kind||'')}function sync(){$('name').value=state.name||'';$('level').value=state.level||0;$('status').value=state.status||'Currently Offline';$('summary').value=state.summary||''}
function paintShowcases(){var host=$('showcaseList');host.innerHTML=(state.showcases||[]).map(function(s,i){return '<div class="sc-row"><span>'+SteamMockup.esc(s.title||s.type)+'</span><button data-up="'+i+'">↑</button><button data-del="'+i+'">×</button></div>'}).join('');host.querySelectorAll('[data-up]').forEach(function(b){b.onclick=function(){var i=+b.dataset.up;if(i>0){var x=state.showcases.splice(i,1)[0];state.showcases.splice(i-1,0,x);render()}}});host.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){state.showcases.splice(+b.dataset.del,1);render()}})}
['name','level','status','summary'].forEach(function(id){$(id).addEventListener(id==='status'?'change':'input',function(){state[id]=id==='level'?Math.max(0,+this.value||0):this.value;render()})});$('addShowcase').onclick=function(){var t=$('newType').value,base={type:t,title:{artwork:'Artwork Showcase',featured:'Featured Artwork Showcase',split:'Artwork Split',workshop:'Workshop Showcase',guide:'Favorite Guide',info:'Info',artfav:'Favorite Artwork'}[t],images:t==='workshop'?['','','','','']:(t==='artwork'||t==='featured'||t==='split'?['','']:[''])};if(t==='workshop'){base.subs=0;base.followers=0}state.showcases.push(base);render()};
$('importBtn').onclick=function(){var url=$('steamUrl').value.trim();if(!url)return;setStatus('importState','Получаем профиль и витрины Steam…','wait');function publicImport(){return fetch('/api/steam/profile?url='+encodeURIComponent(url)).then(function(r){return r.json()})}fetch('/api/profile/steam-import',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})}).then(function(r){return r.status===401?publicImport():r.json()}).then(function(d){if(!d.ok)throw Error(d.msg||'Steam profile unavailable');state=SteamMockup.applySteamProfile(d.profile,SteamMockup.defaultState());sync();render();stage.scrollTop=0;var n=(d.profile.showcases||[]).length,extra=[];if(d.profile.level==null)extra.push('уровень недоступен');if(!(d.profile.stats_map&&Object.keys(d.profile.stats_map).length))extra.push('статистика скрыта');setStatus('importState',(n?'Импортировано витрин: '+n:'Профиль импортирован без витрин')+(extra.length?' · '+extra.join(', '):''),'ok')}).catch(function(e){setStatus('importState',e.message,'bad')})};
function loadAssets(reset){if(reset){page=0;$('catalog').innerHTML=''}var q=$('assetSearch').value.trim(),kind=$('assetKind').value;fetch('/api/steam/backgrounds?asset='+asset+'&kind='+kind+'&q='+encodeURIComponent(q)+'&page='+page+'&count=18').then(function(r){return r.json()}).then(function(d){var items=d.items||[],host=$('catalog');items.forEach(function(it){var u=it.movie||it.video||it.image||it.url||'';if(!u)return;var b=document.createElement('button');b.className='asset';b.innerHTML=/\.(webm|mp4)(\?|$)/i.test(u)?'<video src="'+SteamMockup.esc(SteamMockup.px(u))+'" muted autoplay loop playsinline></video>':'<img src="'+SteamMockup.esc(SteamMockup.px(u))+'" alt="">';b.onclick=function(){if(asset==='background'){state.background=it.image||'';state.backgroundMovie=it.movie||it.video||'';stage.scrollTop=0}else state[asset]=u;render()};host.appendChild(b)});page++}).catch(function(){})}
$('assetTabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){$('assetTabs').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});asset=b.dataset.asset;loadAssets(true)}});$('assetSearch').onchange=function(){loadAssets(true)};$('assetKind').onchange=function(){loadAssets(true)};$('moreAssets').onclick=function(){loadAssets(false)};
stage.addEventListener('click',function(e){var el=e.target.closest('[data-slot]');if(!el)return;pending={slot:el.dataset.slot,index:el.dataset.index};$('mediaInput').value='';$('mediaInput').click()});$('mediaInput').onchange=function(){var f=this.files&&this.files[0];if(!f||!pending)return;var fd=new FormData();fd.append('file',f);setStatus('saveState','Загружаем файл…','wait');fetch('/api/profile/asset',{method:'POST',credentials:'same-origin',body:fd}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw Error(d.msg||'Upload failed');if(pending.slot==='avatar')state.avatar=d.url;else if(pending.slot==='favBadge')state.favBadge.image=d.url;else{var p=String(pending.index).split(':'),sc=state.showcases[+p[0]];if(sc){sc.images=sc.images||[];sc.images[+p[1]]=d.url}}render();setStatus('saveState','Файл добавлен. Нажми «Сохранить профиль».','ok')}).catch(function(e){setStatus('saveState',e.message,'bad')})};
$('saveBtn').onclick=function(){setStatus('saveState','Сохраняем…','wait');fetch('/api/profile/snapshot',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({snapshot:state})}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw Error(d.msg||'Save failed');$('publicLink').href=d.url;$('publicLink').hidden=false;localStorage.setItem(draftKey,JSON.stringify(state));setStatus('saveState','Сохранено. Публичный профиль обновлён.','ok')}).catch(function(e){setStatus('saveState',e.message==='Login required'?'Войди в аккаунт, чтобы сохранить публичный профиль.':e.message,'bad')})};$('topBtn').onclick=function(){stage.scrollTo({top:0,behavior:'smooth'})};
fetch('/api/profile/me',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.ok){var p=d.profile||{};draftKey='sm_profile_draft:user:'+(p.id||p.username||'unknown');if(p.snapshot)state=Object.assign(SteamMockup.defaultState(),p.snapshot);else if(p.steam)state=SteamMockup.applySteamProfile(p.steam,SteamMockup.defaultState());else state=SteamMockup.defaultState();if(p.username){$('publicLink').href='/profile/'+encodeURIComponent(p.username);$('publicLink').hidden=false}}else{try{var draft=JSON.parse(localStorage.getItem(draftKey)||'null');if(draft)state=Object.assign(SteamMockup.defaultState(),draft)}catch(e){}}sync();render()}).catch(function(){try{var draft=JSON.parse(localStorage.getItem(draftKey)||'null');if(draft)state=Object.assign(SteamMockup.defaultState(),draft)}catch(e){}sync();render()});sync();render();loadAssets(true)})();
</script></body></html>
