<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/ss.css?v=20260902a"/>
<link rel="stylesheet" href="/static/css/gallery.css?v=20260902a"/>
</head>
<body class="carousel-mode">

<div id="ssHeadHost"></div>

<header class="site-header" id="siteHeader">
  <nav class="nav">
    <a href="/" class="logo-link" aria-label="Showcase Maker">
      <img class="logo-mark" src="/static/icon.png" alt="" width="32" height="32" onerror="this.style.display='none'"/>
    </a>
    <div style="position:relative">
      <button type="button" class="logo-menu-btn" id="logoMenuBtn" aria-expanded="false">
        <img src="/static/icon.png" alt="" onerror="this.style.display='none'"/>
        <span>Menu</span>
      </button>
      <div class="mobile-menu" id="mobileMenu">
        <a href="/">Home</a>
        <a href="/gallery">Gallery</a>
        <a href="/profile">Profile</a>
        <a href="/app">Tools</a>
        <div class="mm-sep"></div>
        <a href="/app">Open tools →</a>
      </div>
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/gallery" class="active">Gallery</a>
      <a href="/profile">Profile</a>
      <a href="/app">Tools</a>
    </div>
    <div class="nav-right">
      <a class="btn-pill" href="/app">Open tools →</a>
    </div>
  </nav>
</header>

<div class="view-bar" id="viewBar">
  <button type="button" class="active" data-view="carousel">Карусель</button>
  <button type="button" data-view="feed">Лента</button>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Загрузка галереи…</div>
</div>

<div class="stage" id="stage">
  <div class="stage-inner" id="stageInner"></div>
</div>

<div class="feed" id="feed">
  <div class="feed-grid" id="feedGrid"></div>
</div>

<div class="hint" id="hint">Кликни по карточке · колёсико или перетаскивание · пауза при наведении</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-img"><img id="mImg" src="" alt=""/></div>
    <div class="modal-side">
      <div class="modal-head">
        <a class="modal-av" id="mAv" href="#"></a>
        <div class="who">
          <a class="name" id="mAuthor" href="#"></a>
          <div class="sub" id="mSub"></div>
        </div>
        <button type="button" class="modal-close" id="mClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-mode" id="mMode"></div>
        <div class="modal-actions">
          <button type="button" class="like-btn" id="mLike">♥ <span id="mLikes">0</span></button>
        </div>
        <div class="comments" id="mComments"></div>
      </div>
      <div class="composer">
        <input id="mCommentInput" type="text" placeholder="Написать комментарий…" maxlength="500"/>
        <button type="button" id="mCommentSend">Отправить</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/gallery.js?v=20260902a"></script>
<script src="/static/ss-shell.js?v=20260903010000"></script>
</body>
</html>
