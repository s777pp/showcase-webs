<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0c0c0c;--border:rgba(255,255,255,.1);--muted:rgba(255,255,255,.55)}
*{box-sizing:border-box}body{margin:0;font-family:Mulish,system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.03);transition:.2s}
.card:hover{border-color:rgba(0,210,255,.4);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#111}
.meta{padding:12px 14px;font-size:13px}
.meta b{display:block;margin-bottom:4px}
.meta span{color:var(--muted);font-size:12px}
a.back{color:var(--muted);font-size:13px;text-decoration:none}
a.back:hover{color:#fff}
.empty{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/app">← Tools</a>
  <h1 style="margin-top:16px">Публичная галерея</h1>
  <p class="sub">Лучшие витрины пользователей (после модерации). Тестовый раздел.</p>
  <div class="grid" id="grid"><div class="empty">Загрузка…</div></div>
</div>
<script>
fetch('/api/gallery/list').then(r=>r.json()).then(d=>{
  const g=document.getElementById('grid');
  const items=d.items||[];
  if(!items.length){g.innerHTML='<div class="empty">Пока пусто. Загрузи витрину через Tools → после модерации она появится здесь.</div>';return;}
  g.innerHTML='';
  items.forEach(it=>{
    const el=document.createElement('a');
    el.className='card'; el.href=it.url; el.target='_blank';
    el.innerHTML=`<img src="${it.url}" alt="" loading="lazy"/><div class="meta"><b>${it.title||it.mode||'Showcase'}</b><span>${it.author||''}</span></div>`;
    g.appendChild(el);
  });
}).catch(()=>{document.getElementById('grid').innerHTML='<div class="empty">Ошибка загрузки</div>';});
</script>
</body>
</html>
