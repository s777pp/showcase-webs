<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0c0c;--panel:#121212;--border:rgba(255,255,255,.1);
  --muted:rgba(255,255,255,.55);--ok:#28c840;--err:#ff5f57;--accent:#00d2ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Mulish,system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);
  background:rgba(12,12,12,.85);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 20px;max-width:1400px;margin:0 auto;
}
.topbar .links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.topbar a{color:var(--muted);font-size:13px;text-decoration:none}
.topbar a:hover{color:#fff}
.top-right{display:flex;align-items:center;gap:10px}
.bell-wrap{position:relative}
.bell{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:#fff;cursor:pointer;
  display:grid;place-items:center;font-size:18px;
}
.bell:hover{border-color:rgba(0,210,255,.4)}
.bell .dot{
  position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--err);color:#fff;font-size:10px;font-weight:700;
  display:none;align-items:center;justify-content:center;
}
.bell .dot.on{display:flex}
.notif-panel{
  display:none;position:absolute;right:0;top:48px;width:min(360px,92vw);
  background:#161616;border:1px solid var(--border);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden;z-index:50;
}
.notif-panel.open{display:block}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.notif-list{max-height:360px;overflow:auto}
.notif-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.notif-item:hover{background:rgba(255,255,255,.04)}
.notif-item.unread{background:rgba(0,210,255,.06)}
.notif-item img,.notif-item .ph{
  width:36px;height:36px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);
  border:1px solid var(--border);flex-shrink:0;display:grid;place-items:center;font-size:12px;font-weight:700
}
.notif-item .t{font-size:13px;line-height:1.35}
.notif-item .when{font-size:11px;color:var(--muted);margin-top:4px}
.wrap{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tabs button{border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px}
.tabs button.active{background:rgba(255,255,255,.1);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{
  border:1px solid var(--border);border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.03);position:relative;cursor:pointer;
  transition:transform .15s ease, border-color .15s ease;
}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18)}
.card img.shot{width:100%;display:block;background:#0a0a0a;min-height:220px;object-fit:contain;max-height:480px}
.meta{padding:14px 16px 16px}
.meta .title{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.3}
.author{display:flex;align-items:center;gap:12px}
.author img,.author .ph{
  width:44px;height:44px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,.08);
  border:1px solid var(--border);flex-shrink:0
}
.author .ph{display:grid;place-items:center;font-size:15px;font-weight:800;color:rgba(255,255,255,.75)}
.author .name{font-size:15px;font-weight:700;color:#fff}
.author .mode{font-size:12px;color:var(--muted);margin-top:2px}
.stats{display:flex;gap:12px;margin-top:12px;color:var(--muted);font-size:13px;font-weight:600}
.stats span{display:inline-flex;align-items:center;gap:5px}
.admin-badge{font-size:11px;color:var(--accent);margin-left:8px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.btn{border:none;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}
.btn.err{background:var(--err);color:#fff}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.btn.accent{background:rgba(0,210,255,.15);color:var(--accent);border:1px solid rgba(0,210,255,.35)}
.btn.like.on{background:rgba(255,95,87,.18);color:#ff8b84;border-color:rgba(255,95,87,.4)}

/* Modal */
.overlay{
  display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);padding:16px;overflow:auto;
}
.overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{
  width:min(1100px,100%);margin:24px auto;background:#111;border:1px solid var(--border);
  border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1.4fr 1fr;
  max-height:calc(100vh - 48px);
}
@media(max-width:860px){.modal{grid-template-columns:1fr;max-height:none}}
.modal-media{
  background:#050505;display:flex;align-items:center;justify-content:center;
  min-height:280px;max-height:calc(100vh - 48px);overflow:auto;
}
.modal-media img,.modal-media video{max-width:100%;max-height:calc(100vh - 48px);display:block}
.modal-side{display:flex;flex-direction:column;border-left:1px solid var(--border);min-height:0;max-height:calc(100vh - 48px)}
@media(max-width:860px){.modal-side{border-left:none;border-top:1px solid var(--border);max-height:none}}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}
.modal-head img,.modal-head .ph{
  width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--border);
  background:rgba(255,255,255,.08);flex-shrink:0;display:grid;place-items:center;font-weight:800
}
.modal-head .who{font-weight:800;font-size:16px}
.modal-head .ttl{font-size:13px;color:var(--muted);margin-top:2px}
.modal-close{
  margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:#fff;cursor:pointer;font-size:18px
}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border)}
.comments{flex:1;overflow:auto;padding:12px 18px;min-height:180px}
.cmt{display:grid;grid-template-columns:40px 1fr;gap:10px;margin-bottom:14px}
.cmt.reply{margin-left:28px;grid-template-columns:32px 1fr}
.cmt img,.cmt .ph{
  width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--border);
  background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px;font-weight:800
}
.cmt.reply img,.cmt.reply .ph{width:32px;height:32px;font-size:11px}
.cmt .an{font-weight:700;font-size:13px}
.cmt .bd{font-size:14px;line-height:1.4;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.cmt .meta-line{font-size:11px;color:var(--muted);margin-top:5px;display:flex;gap:10px}
.cmt .meta-line button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:11px;padding:0;font-weight:700}
.composer{padding:12px 18px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.composer textarea{
  width:100%;min-height:64px;resize:vertical;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:#fff;padding:10px 12px;font:inherit
}
.composer .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.composer .hint{font-size:12px;color:var(--muted)}
.login-hint{font-size:13px;color:var(--muted);padding:8px 0}
</style>
</head>
<body>
<div class="topbar">
  <div class="links">
    <a href="/">← Home</a>
    <a href="/app">Tools</a>
    <a href="/gallery">Gallery</a>
  </div>
  <div class="top-right">
    <div class="bell-wrap" id="bellWrap" style="display:none">
      <button type="button" class="bell" id="btnBell" title="Уведомления">🔔<span class="dot" id="bellDot">0</span></button>
      <div class="notif-panel" id="notifPanel">
        <div class="notif-head">
          <span>Уведомления</span>
          <button type="button" class="btn ghost" id="btnReadAll" style="padding:4px 10px">Прочитать все</button>
        </div>
        <div class="notif-list" id="notifList"><div class="empty" style="padding:20px">Пока пусто</div></div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">
  <h1>Публичная галерея <span class="admin-badge" id="adminBadge" style="display:none">admin</span></h1>
  <p class="sub">Работы сообщества · лайки, комментарии, шаринг</p>
  <div class="tabs">
    <button type="button" class="active" data-status="approved">Все работы</button>
  </div>
  <div class="grid" id="g"></div>
  <div class="empty" id="empty" style="display:none">Пока нет работ</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-media" id="modalMedia"></div>
    <div class="modal-side">
      <div class="modal-head">
        <span class="ph" id="mAvPh">?</span>
        <img id="mAv" alt="" style="display:none"/>
        <div style="min-width:0">
          <div class="who" id="mAuthor">—</div>
          <div class="ttl" id="mTitle">—</div>
        </div>
        <button type="button" class="modal-close" id="mClose" title="Close">✕</button>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn ghost like" id="btnLike">♡ <span id="likeCount">0</span></button>
        <button type="button" class="btn ghost" id="btnShare">↗ Поделиться</button>
        <button type="button" class="btn ghost" id="btnOpenTab">Открыть файл</button>
        <button type="button" class="btn err" id="btnAdminDel" style="display:none;margin-left:auto">Удалить</button>
      </div>
      <div class="comments" id="comments"></div>
      <div class="composer" id="composer">
        <div class="login-hint" id="loginHint" style="display:none">Войдите в аккаунт, чтобы лайкать и комментировать — <a href="/app#account" style="color:var(--accent)">Tools → Account</a></div>
        <textarea id="cmtBody" placeholder="Написать комментарий…" maxlength="1000"></textarea>
        <div class="row">
          <span class="hint" id="replyHint"></span>
          <div style="display:flex;gap:8px">
            <button type="button" class="btn ghost" id="btnCancelReply" style="display:none">Отмена</button>
            <button type="button" class="btn accent" id="btnSendCmt">Отправить</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const headers = () => {
  const h = {};
  try {
    const s = localStorage.getItem('sm_session') || '';
    if (s) h['X-Session-Token'] = s;
  } catch(e){}
  return h;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialOf = (name) => (String(name||'?').trim().charAt(0)||'?').toUpperCase();
const timeAgo = (ts) => {
  if (!ts) return '';
  const s = Math.max(0, (Date.now()/1000) - Number(ts));
  if (s < 60) return 'только что';
  if (s < 3600) return Math.floor(s/60) + ' мин';
  if (s < 86400) return Math.floor(s/3600) + ' ч';
  if (s < 604800) return Math.floor(s/86400) + ' д';
  return new Date(Number(ts)*1000).toLocaleDateString();
};

let isAdmin = false;
let loggedIn = false;
let currentItem = null;
let replyTo = null;
let itemsCache = {};

async function checkAdmin(){
  try {
    const r = await fetch('/api/gallery/am_admin', { credentials:'include', headers: headers() });
    const d = await r.json().catch(()=>({}));
    isAdmin = !!(d && d.ok && d.admin);
    const b = document.getElementById('adminBadge');
    if (b) b.style.display = isAdmin ? 'inline' : 'none';
  } catch(e){}
}

async function refreshNotifBadge(){
  const wrap = document.getElementById('bellWrap');
  try {
    const r = await fetch('/api/notifications/unread', { credentials:'include', headers: headers() });
    const d = await r.json().catch(()=>({}));
    loggedIn = !!(d && d.logged_in);
    if (wrap) wrap.style.display = loggedIn ? 'block' : 'none';
    const dot = document.getElementById('bellDot');
    const n = (d && d.unread) || 0;
    if (dot) {
      if (n > 0) { dot.textContent = n > 99 ? '99+' : String(n); dot.classList.add('on'); }
      else { dot.classList.remove('on'); }
    }
  } catch(e){
    if (wrap) wrap.style.display = 'none';
  }
}

async function loadNotifs(){
  const list = document.getElementById('notifList');
  list.innerHTML = '<div class="empty" style="padding:16px">Загрузка…</div>';
  try {
    const r = await fetch('/api/notifications?limit=40', { credentials:'include', headers: headers() });
    const d = await r.json().catch(()=>({}));
    if (!r.ok || !d.ok) { list.innerHTML = '<div class="empty" style="padding:16px">Войдите в аккаунт</div>'; return; }
    const items = d.items || [];
    if (!items.length) { list.innerHTML = '<div class="empty" style="padding:16px">Пока пусто</div>'; return; }
    list.innerHTML = '';
    items.forEach(it => {
      const el = document.createElement('div');
      el.className = 'notif-item' + (it.is_read ? '' : ' unread');
      const av = it.actor_avatar || '';
      const ini = initialOf(it.actor);
      el.innerHTML = `
        ${av ? `<img src="${esc(av)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><span class="ph" style="display:none">${esc(ini)}</span>` : `<span class="ph">${esc(ini)}</span>`}
        <div>
          <div class="t">${esc(it.body||'')}</div>
          <div class="when">${esc(timeAgo(it.created_at))}</div>
        </div>`;
      el.onclick = async () => {
        try {
          await fetch('/api/notifications/read', {
            method:'POST', credentials:'include', headers:{...headers(),'Content-Type':'application/json'},
            body: JSON.stringify({ ids: [it.id] })
          });
        } catch(e){}
        document.getElementById('notifPanel').classList.remove('open');
        if (it.item_id && itemsCache[it.item_id]) openModal(itemsCache[it.item_id]);
        else if (it.item_id) {
          // open by id if not in cache
          openModal({ id: it.item_id, title: '', author: '', avatar_url: '', url: '/api/gallery/image/'+it.item_id, likes:0, comments:0, liked:false });
        }
        refreshNotifBadge();
      };
      list.appendChild(el);
    });
  } catch(e){
    list.innerHTML = '<div class="empty" style="padding:16px">'+esc(String(e))+'</div>';
  }
}

document.getElementById('btnBell').onclick = (e) => {
  e.stopPropagation();
  const p = document.getElementById('notifPanel');
  const open = !p.classList.contains('open');
  p.classList.toggle('open', open);
  if (open) loadNotifs();
};
document.getElementById('btnReadAll').onclick = async (e) => {
  e.stopPropagation();
  await fetch('/api/notifications/read', {
    method:'POST', credentials:'include', headers:{...headers(),'Content-Type':'application/json'},
    body: JSON.stringify({})
  });
  refreshNotifBadge();
  loadNotifs();
};
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('bellWrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('notifPanel').classList.remove('open');
});

function cardHtml(it){
  const id = it.id;
  const imgUrl = it.url || ('/api/gallery/image/' + id);
  const av = it.avatar_url || '';
  const author = it.author || 'anon';
  const title = it.title || it.mode || 'Showcase';
  const initial = initialOf(author);
  const likes = it.likes || 0;
  const comments = it.comments || 0;
  return `
    <img class="shot" src="${esc(imgUrl)}" alt="" loading="lazy"/>
    <div class="meta">
      <div class="title">${esc(title)}</div>
      <div class="author">
        ${av
          ? `<img src="${esc(av)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><span class="ph" style="display:none">${esc(initial)}</span>`
          : `<span class="ph">${esc(initial)}</span>`}
        <div>
          <div class="name">${esc(author)}</div>
          <div class="mode">${esc(it.mode||'')}</div>
        </div>
      </div>
      <div class="stats">
        <span>♡ ${likes}</span>
        <span>💬 ${comments}</span>
      </div>
    </div>`;
}

async function load(){
  const g = document.getElementById('g');
  const empty = document.getElementById('empty');
  g.innerHTML = '';
  try {
    const r = await fetch('/api/gallery/list?status=approved&limit=60', { credentials:'include', headers: headers() });
    const d = await r.json().catch(()=>({}));
    loggedIn = !!(d && d.logged_in);
    refreshNotifBadge();
    const items = (d && d.items) || [];
    if (!items.length) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    items.forEach(it => {
      itemsCache[it.id] = it;
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = cardHtml(it);
      el.onclick = () => openModal(it);
      if (isAdmin) {
        const act = document.createElement('div');
        act.style.cssText = 'padding:0 14px 14px';
        act.innerHTML = `<button type="button" class="btn err">Удалить</button>`;
        act.querySelector('button').onclick = async (ev) => {
          ev.stopPropagation();
          if (!confirm('Удалить эту работу из галереи?')) return;
          const rr = await fetch('/api/gallery/delete/' + it.id, { method:'POST', credentials:'include', headers: headers() });
          const dd = await rr.json().catch(()=>({}));
          if (!rr.ok || !dd.ok) { alert(dd.msg || 'Delete failed'); return; }
          el.remove();
        };
        el.appendChild(act);
      }
      g.appendChild(el);
    });
  } catch (e) {
    empty.style.display = 'block';
    empty.textContent = String(e);
  }
}

function setAuthorUI(it){
  const author = it.author || 'anon';
  const av = it.avatar_url || '';
  document.getElementById('mAuthor').textContent = author;
  document.getElementById('mTitle').textContent = (it.title || it.mode || 'Showcase') + (it.mode ? ' · ' + it.mode : '');
  const img = document.getElementById('mAv');
  const ph = document.getElementById('mAvPh');
  if (av) {
    img.style.display = 'block';
    ph.style.display = 'none';
    img.src = av + (av.includes('?') ? '&' : '?') + 't=' + Date.now();
    img.onerror = () => { img.style.display='none'; ph.style.display='grid'; ph.textContent = initialOf(author); };
  } else {
    img.style.display = 'none';
    ph.style.display = 'grid';
    ph.textContent = initialOf(author);
  }
}

function renderComments(list){
  const box = document.getElementById('comments');
  if (!list.length) {
    box.innerHTML = '<div class="empty" style="padding:12px 0">Комментариев пока нет — будьте первым</div>';
    return;
  }
  const byParent = {};
  const roots = [];
  list.forEach(c => {
    if (c.parent_id) {
      (byParent[c.parent_id] = byParent[c.parent_id] || []).push(c);
    } else roots.push(c);
  });
  const renderOne = (c, isReply) => {
    const av = c.avatar_url || '';
    const ini = initialOf(c.author);
    return `<div class="cmt${isReply?' reply':''}" data-id="${c.id}">
      ${av ? `<img src="${esc(av)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"/><span class="ph" style="display:none">${esc(ini)}</span>` : `<span class="ph">${esc(ini)}</span>`}
      <div>
        <div class="an">${esc(c.author||'anon')}</div>
        <div class="bd">${esc(c.body||'')}</div>
        <div class="meta-line">
          <span>${esc(timeAgo(c.created_at))}</span>
          <button type="button" data-reply="${c.id}" data-author="${esc(c.author||'')}">Ответить</button>
        </div>
      </div>
    </div>` + (byParent[c.id]||[]).map(ch => renderOne(ch, true)).join('');
  };
  box.innerHTML = roots.map(c => renderOne(c, false)).join('');
  box.querySelectorAll('[data-reply]').forEach(btn => {
    btn.onclick = () => {
      replyTo = { id: Number(btn.dataset.reply), author: btn.dataset.author || '' };
      document.getElementById('replyHint').textContent = 'Ответ для @' + replyTo.author;
      document.getElementById('btnCancelReply').style.display = '';
      document.getElementById('cmtBody').focus();
    };
  });
}

async function loadComments(itemId){
  const r = await fetch('/api/gallery/' + itemId + '/comments', { credentials:'include', headers: headers() });
  const d = await r.json().catch(()=>({}));
  const likes = d.likes || 0;
  const liked = !!d.liked;
  document.getElementById('likeCount').textContent = String(likes);
  const btn = document.getElementById('btnLike');
  btn.classList.toggle('on', liked);
  btn.innerHTML = (liked ? '♥ ' : '♡ ') + '<span id="likeCount">' + likes + '</span>';
  renderComments(d.comments || []);
  if (currentItem) {
    currentItem.likes = likes;
    currentItem.liked = liked;
    currentItem.comments = (d.comments || []).length;
  }
}

function openModal(it){
  currentItem = it;
  replyTo = null;
  document.getElementById('replyHint').textContent = '';
  document.getElementById('btnCancelReply').style.display = 'none';
  document.getElementById('cmtBody').value = '';
  setAuthorUI(it);
  const media = document.getElementById('modalMedia');
  const url = it.url || ('/api/gallery/image/' + it.id);
  const isGif = /\.gif(\?|$)/i.test(url) || (it.mode||'').toLowerCase().includes('gif');
  media.innerHTML = `<img src="${esc(url)}" alt=""/>`;
  document.getElementById('btnOpenTab').onclick = () => window.open(url, '_blank');
  document.getElementById('btnAdminDel').style.display = isAdmin ? '' : 'none';
  document.getElementById('loginHint').style.display = loggedIn ? 'none' : 'block';
  document.getElementById('cmtBody').disabled = !loggedIn;
  document.getElementById('btnSendCmt').disabled = !loggedIn;
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  loadComments(it.id);
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
  currentItem = null;
  // soft refresh counts on cards
  load();
}
document.getElementById('mClose').onclick = closeModal;
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

document.getElementById('btnLike').onclick = async () => {
  if (!currentItem) return;
  if (!loggedIn) { alert('Войдите в аккаунт, чтобы лайкать'); return; }
  const r = await fetch('/api/gallery/' + currentItem.id + '/like', {
    method:'POST', credentials:'include', headers: headers()
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok || !d.ok) { alert(d.msg || 'Like failed'); return; }
  const btn = document.getElementById('btnLike');
  btn.classList.toggle('on', !!d.liked);
  btn.innerHTML = (d.liked ? '♥ ' : '♡ ') + '<span id="likeCount">' + (d.likes||0) + '</span>';
  currentItem.liked = !!d.liked;
  currentItem.likes = d.likes || 0;
};

document.getElementById('btnShare').onclick = async () => {
  if (!currentItem) return;
  const url = location.origin + '/gallery?item=' + currentItem.id;
  try {
    if (navigator.share) await navigator.share({ title: currentItem.title || 'Showcase', url });
    else { await navigator.clipboard.writeText(url); alert('Ссылка скопирована'); }
  } catch(e) {
    try { await navigator.clipboard.writeText(url); alert('Ссылка скопирована'); } catch(_) {}
  }
};

document.getElementById('btnCancelReply').onclick = () => {
  replyTo = null;
  document.getElementById('replyHint').textContent = '';
  document.getElementById('btnCancelReply').style.display = 'none';
};

document.getElementById('btnSendCmt').onclick = async () => {
  if (!currentItem || !loggedIn) return;
  const body = document.getElementById('cmtBody').value.trim();
  if (!body) return;
  const payload = { body };
  if (replyTo && replyTo.id) payload.parent_id = replyTo.id;
  const r = await fetch('/api/gallery/' + currentItem.id + '/comments', {
    method:'POST', credentials:'include',
    headers:{...headers(),'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok || !d.ok) { alert(d.msg || 'Comment failed'); return; }
  document.getElementById('cmtBody').value = '';
  replyTo = null;
  document.getElementById('replyHint').textContent = '';
  document.getElementById('btnCancelReply').style.display = 'none';
  await loadComments(currentItem.id);
};

document.getElementById('btnAdminDel').onclick = async () => {
  if (!currentItem || !isAdmin) return;
  if (!confirm('Удалить эту работу?')) return;
  const rr = await fetch('/api/gallery/delete/' + currentItem.id, { method:'POST', credentials:'include', headers: headers() });
  const dd = await rr.json().catch(()=>({}));
  if (!rr.ok || !dd.ok) { alert(dd.msg || 'Delete failed'); return; }
  closeModal();
};

// deep link ?item=ID
(async function init(){
  await checkAdmin();
  await load();
  await refreshNotifBadge();
  setInterval(refreshNotifBadge, 45000);
  const q = new URLSearchParams(location.search);
  const itemId = q.get('item');
  if (itemId && itemsCache[itemId]) openModal(itemsCache[itemId]);
  else if (itemId) openModal({ id: Number(itemId), title:'', author:'', avatar_url:'', url:'/api/gallery/image/'+itemId, likes:0, comments:0, liked:false });
})();
</script>
