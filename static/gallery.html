<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/ss.css?v=20260901c"/>
<style>
:root{
  --bg:#0c0c0c;
  --panel:#121212;
  --border:rgba(255,255,255,.1);
  --muted:rgba(255,255,255,.55);
  --accent:#00d2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Mulish,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
body.carousel-mode{overflow:hidden}
body.feed-mode{overflow:auto}

/* ===== Transparent header ===== */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:transparent;
  border-bottom:1px solid transparent;
  transition:background .25s, border-color .25s, backdrop-filter .25s;
}
.site-header.scrolled{
  background:rgba(12,12,12,.72);
  backdrop-filter:blur(14px);
  border-bottom-color:var(--border);
}
.nav{
  max-width:72rem;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo-link{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;display:block;border-radius:8px;object-fit:cover}
.nav-links{display:none;gap:28px;align-items:center}
@media(min-width:768px){.nav-links{display:flex}}
.nav-links a{
  color:rgba(255,255,255,.7);font-size:14px;font-weight:500;
  transition:color .2s;white-space:nowrap;
}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-pill{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;
  white-space:nowrap;transition:background .2s;cursor:pointer;font-family:inherit;
}
.btn-pill:hover{background:rgba(255,255,255,.14)}
.btn-shiny-nav{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 14px;border-radius:999px;
  font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;
  background-image:linear-gradient(to right,#091020,#0B2551 12%,#A4F4FD 32%,#00d2ff 50%,#0B2551 68%,#091020);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;animation:shiny 6s linear infinite;
  border:none;font-family:inherit;
}
@keyframes shiny{0%{background-position:-200% center}100%{background-position:200% center}}
.logo-menu-btn{
  display:flex;align-items:center;gap:8px;
  background:none;border:none;color:#fff;cursor:pointer;padding:0;
  font-family:inherit;font-size:13px;
}
@media(min-width:768px){.logo-menu-btn{display:none}}
.logo-menu-btn img{width:28px;height:28px;border-radius:7px}
.mobile-menu{
  display:none;position:absolute;top:calc(100% + 8px);left:0;
  min-width:180px;background:rgba(18,18,18,.98);border:1px solid var(--border);
  border-radius:14px;padding:8px;z-index:80;box-shadow:0 16px 48px rgba(0,0,0,.5);
}
.mobile-menu.open{display:block}
.mobile-menu a{
  display:block;padding:10px 12px;border-radius:10px;
  color:rgba(255,255,255,.8);font-size:14px;
}
.mobile-menu a:hover{background:rgba(255,255,255,.06);color:#fff}
.mm-sep{height:1px;background:var(--border);margin:6px 0}

/* view toggle */
.view-bar{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  z-index:90;display:flex;gap:6px;padding:4px;
  background:rgba(20,20,20,.7);border:1px solid var(--border);
  border-radius:999px;backdrop-filter:blur(10px);
}
.view-bar button{
  border:none;background:transparent;color:rgba(255,255,255,.55);
  font-family:inherit;font-size:12px;font-weight:600;padding:8px 14px;
  border-radius:999px;cursor:pointer;transition:all .2s;
}
.view-bar button.active{background:rgba(255,255,255,.12);color:#fff}

/* ===== Carousel stage (horizontal) ===== */
.stage{
  position:fixed;inset:0;top:0;
  background:#000;
  overflow:hidden;
  display:none;
}
body.carousel-mode .stage{display:block}
.stage-inner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;
}
.card-root{position:absolute;transform-style:preserve-3d}
.card{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  will-change:transform;
  cursor:pointer;
  pointer-events:auto;
}
.layer{position:absolute;inset:0;border-radius:16px;overflow:hidden;pointer-events:none}
.layer-mid{background:#141414;border:1px solid rgba(255,255,255,.08)}
.layer-face{
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.1);
  backface-visibility:hidden;
}
.layer-face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.78) 0%,transparent 45%,rgba(0,0,0,.25) 100%);
}
.face-logo{
  position:absolute;top:14px;left:14px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;
  backdrop-filter:blur(6px);
}
.face-badge{
  position:absolute;top:14px;right:14px;
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  padding:4px 10px;border-radius:999px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.82);
}
.face-meta{position:absolute;left:0;right:0;bottom:0;padding:16px}
.face-title{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face-author{font-size:11px;color:rgba(255,255,255,.48);margin-top:2px}
.back-blur img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);filter:blur(18px)}
.back-dim{position:absolute;inset:0;background:rgba(0,0,0,.58)}
.back-stripe{position:absolute;top:20px;left:0;right:0;height:28px;background:rgba(0,0,0,.85)}
.back-info{position:absolute;left:0;right:0;bottom:0;padding:18px;display:flex;flex-direction:column;gap:6px}
.back-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.back-tags span{
  font-size:10px;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);
}

/* ===== Feed grid ===== */
.feed{
  display:none;
  max-width:1100px;margin:0 auto;
  padding:110px 20px 60px;
}
body.feed-mode .feed{display:block}
.feed-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}
.feed-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:transform .2s, border-color .2s;
}
.feed-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.feed-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#111}
.feed-card .info{padding:12px 14px}
.feed-card .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed-card .a{font-size:12px;color:var(--muted);margin-top:3px}
.feed-card .stats{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)}

/* loading / empty */
.loading,.empty-state{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:var(--muted);font-size:14px;z-index:5;
}
.spinner{
  width:28px;height:28px;border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  z-index:50;font-size:12px;color:rgba(255,255,255,.3);
  pointer-events:none;letter-spacing:.02em;
}
body.feed-mode .hint{display:none}

/* ===== Modal ===== */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,.75);backdrop-filter:blur(12px);
  align-items:flex-start;justify-content:center;
  padding:40px 16px;overflow-y:auto;
}
.modal-bg.open{display:flex}
.modal{
  width:min(920px,100%);
  background:#111;border:1px solid var(--border);
  border-radius:18px;overflow:hidden;
  display:grid;grid-template-columns:1.2fr 1fr;
  margin:auto;
}
@media(max-width:720px){.modal{grid-template-columns:1fr}}
.modal-img{
  background:#050505;min-height:320px;
  display:flex;align-items:center;justify-content:center;
}
.modal-img img{max-width:100%;max-height:70vh;object-fit:contain}
.modal-side{display:flex;flex-direction:column;max-height:80vh}
.modal-head{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;gap:12px;align-items:center;
}
.modal-av{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.08);display:grid;place-items:center;
  font-weight:800;font-size:14px;flex-shrink:0;overflow:hidden;
}
.modal-av img{width:100%;height:100%;object-fit:cover}
.modal-head .who{min-width:0;flex:1}
.modal-head .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-head .sub{font-size:12px;color:var(--muted)}
.modal-close{
  width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
  font-size:18px;line-height:1;flex-shrink:0;
}
.modal-close:hover{background:rgba(255,255,255,.14)}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-title{font-size:16px;font-weight:700;margin-bottom:6px}
.modal-mode{
  display:inline-block;font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.08);color:var(--muted);margin-bottom:14px;
}
.modal-actions{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.like-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:#fff;font-family:inherit;
  font-size:13px;font-weight:600;cursor:pointer;
}
.like-btn.liked{border-color:rgba(255,80,100,.5);color:#ff6b81;background:rgba(255,80,100,.1)}
.like-btn:hover{background:rgba(255,255,255,.1)}
.comments{display:flex;flex-direction:column;gap:10px}
.comment{
  padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);font-size:13px;
}
.comment .c-author{font-weight:600;font-size:12px;margin-bottom:3px}
.comment .c-text{color:rgba(255,255,255,.8);line-height:1.4}
.comment-empty{font-size:13px;color:var(--muted);padding:8px 0}
.composer{
  padding:12px 18px;border-top:1px solid var(--border);
  display:flex;gap:8px;align-items:center;
}
.composer input{
  flex:1;padding:10px 14px;border-radius:999px;
  border:1px solid var(--border);background:rgba(255,255,255,.05);
  color:#fff;font-family:inherit;font-size:13px;outline:none;
}
.composer input:focus{border-color:rgba(0,210,255,.4)}
.composer button{
  padding:10px 16px;border-radius:999px;border:none;
  background:#fff;color:#0c0c0c;font-weight:600;font-size:13px;
  font-family:inherit;cursor:pointer;
}
.composer button:hover{opacity:.9}
</style>
<style id="sm-gallery-unified-theme">
:root{--accent:#35c9f2;--bg:#05090d;--panel:rgba(10,18,25,.78);--border:rgba(139,233,255,.13)}
body{background:radial-gradient(55% 70% at 8% 18%,rgba(30,178,216,.14),transparent 68%),radial-gradient(55% 70% at 92% 70%,rgba(52,120,246,.13),transparent 70%),#05090d!important}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(67,215,255,.018) 1px,transparent 1px),linear-gradient(rgba(67,215,255,.014) 1px,transparent 1px);background-size:72px 72px;z-index:0}
#ssHeadHost{position:relative;z-index:150;padding-top:2px}
.site-header{display:none!important}
.view-bar{top:92px;background:rgba(7,13,19,.74);border-color:rgba(139,233,255,.15);backdrop-filter:blur(20px)}
.view-bar button.active{background:rgba(53,201,242,.14);color:#eefdff;box-shadow:inset 0 0 0 1px rgba(139,233,255,.15)}
.stage{background:transparent!important;top:74px}
.layer{border-radius:22px}
.feed{padding-top:132px!important;position:relative;z-index:2}
.feed-card{border-radius:18px!important;background:linear-gradient(145deg,rgba(14,23,31,.84),rgba(7,12,18,.76))!important;border-color:rgba(139,233,255,.12)!important;box-shadow:0 20px 55px rgba(0,0,0,.22);overflow:hidden}
.feed-card:hover{border-color:rgba(139,233,255,.3)!important;transform:translateY(-5px)}
.modal-content,.composer{background:rgba(7,13,19,.9)!important;border-color:rgba(139,233,255,.16)!important;backdrop-filter:blur(24px)}
@media(max-width:640px){.view-bar{top:82px}.stage{top:68px}.feed{padding-top:122px!important}}
</style>
</head>
<body class="carousel-mode">

<div id="ssHeadHost"></div>

<header class="site-header" id="siteHeader">
  <nav class="nav">
    <a href="/" class="logo-link" aria-label="Showcase Maker">
      <img class="logo-mark" src="/static/icon.png" alt="" width="32" height="32" onerror="this.style.display='none'"/>
    </a>
    <div style="position:relative">
      <button type="button" class="logo-menu-btn" id="logoMenuBtn" aria-expanded="false">
        <img src="/static/icon.png" alt="" onerror="this.style.display='none'"/>
        <span>Menu</span>
      </button>
      <div class="mobile-menu" id="mobileMenu">
        <a href="/">Home</a>
        <a href="/gallery">Gallery</a>
        <a href="/profile">Profile</a>
        <a href="/app">Tools</a>
        <div class="mm-sep"></div>
        <a href="/app">Open tools →</a>
      </div>
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/gallery" class="active">Gallery</a>
      <a href="/profile">Profile</a>
      <a href="/app">Tools</a>
    </div>
    <div class="nav-right">
      <a class="btn-pill" href="/app">Open tools →</a>
    </div>
  </nav>
</header>

<div class="view-bar" id="viewBar">
  <button type="button" class="active" data-view="carousel">Карусель</button>
  <button type="button" data-view="feed">Лента</button>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Загрузка галереи…</div>
</div>

<div class="stage" id="stage">
  <div class="stage-inner" id="stageInner"></div>
</div>

<div class="feed" id="feed">
  <div class="feed-grid" id="feedGrid"></div>
</div>

<div class="hint" id="hint">Кликни по карточке · колёсико или перетаскивание · пауза при наведении</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-img"><img id="mImg" src="" alt=""/></div>
    <div class="modal-side">
      <div class="modal-head">
        <a class="modal-av" id="mAv" href="#"></a>
        <div class="who">
          <a class="name" id="mAuthor" href="#"></a>
          <div class="sub" id="mSub"></div>
        </div>
        <button type="button" class="modal-close" id="mClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-mode" id="mMode"></div>
        <div class="modal-actions">
          <button type="button" class="like-btn" id="mLike">♥ <span id="mLikes">0</span></button>
        </div>
        <div class="comments" id="mComments"></div>
      </div>
      <div class="composer">
        <input id="mCommentInput" type="text" placeholder="Написать комментарий…" maxlength="500"/>
        <button type="button" id="mCommentSend">Отправить</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  // mobile menu
  const menuBtn = $('#logoMenuBtn');
  const mobileMenu = $('#mobileMenu');
  if (menuBtn && mobileMenu) {
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      mobileMenu.classList.toggle('open');
    });
    document.addEventListener('click', () => mobileMenu.classList.remove('open'));
  }

  // header transparency on scroll (feed mode)
  const header = $('#siteHeader');
  window.addEventListener('scroll', () => {
    header.classList.toggle('scrolled', window.scrollY > 20);
  }, { passive: true });

  // view toggle
  let viewMode = 'carousel';
  $$('#viewBar button').forEach((b) => {
    b.addEventListener('click', () => {
      $$('#viewBar button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      viewMode = b.dataset.view;
      document.body.classList.toggle('carousel-mode', viewMode === 'carousel');
      document.body.classList.toggle('feed-mode', viewMode === 'feed');
      if (viewMode === 'carousel') startLoop();
      else stopLoop();
    });
  });

  let items = [];
  let cardCount = 0;
  let cards = [];
  let metrics = { cardW: 280, cardH: 380 };
  let progress = 0;
  let paused = false;
  let dragging = false;
  let dragStartX = 0;
  let dragStartProgress = 0;
  const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
  let raf = 0;
  let currentItem = null;

  const stage = $('#stage');
  const stageInner = $('#stageInner');
  const feedGrid = $('#feedGrid');
  const loadingEl = $('#loading');

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    let cardW = Math.round(Math.min(300, Math.max(160, w * 0.18)));
    const hf = Math.min(1, Math.max(0.7, h / 900));
    cardW = Math.round(cardW * hf);
    metrics = { cardW, cardH: Math.round(cardW * 1.35) };
    const root = stageInner.querySelector('.card-root');
    if (root) {
      root.style.width = metrics.cardW + 'px';
      root.style.height = metrics.cardH + 'px';
    }
    cards.forEach((c) => {
      if (!c) return;
      c.style.width = metrics.cardW + 'px';
      c.style.height = metrics.cardH + 'px';
    });
  }

  function buildCarousel() {
    stageInner.innerHTML = '';
    cards = [];
    const root = document.createElement('div');
    root.className = 'card-root';
    root.style.width = metrics.cardW + 'px';
    root.style.height = metrics.cardH + 'px';
    root.style.transformStyle = 'preserve-3d';

    const thickness = [-1.3, -0.65, 0, 0.65, 1.3];

    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.idx = i;
      card.style.width = metrics.cardW + 'px';
      card.style.height = metrics.cardH + 'px';
      card.style.transformStyle = 'preserve-3d';

      thickness.forEach((zOff, li) => {
        const isFront = li === thickness.length - 1;
        const isBack = li === 0;
        const layer = document.createElement('div');
        layer.className = 'layer';

        if (!isFront && !isBack) {
          layer.classList.add('layer-mid');
          layer.style.transform = `translateZ(${zOff}px)`;
        } else if (isFront) {
          layer.classList.add('layer-face');
          layer.style.transform = `translateZ(${zOff}px)`;
          layer.innerHTML = `
            <img src="${item.url}" alt="${escapeHtml(item.title)}" draggable="false" loading="lazy"/>
            <div class="face-grad"></div>
            <div class="face-logo">S</div>
            <div class="face-badge">${escapeHtml(item.mode || 'Showcase')}</div>
            <div class="face-meta">
              <div class="face-title">${escapeHtml(item.title || 'Untitled')}</div>
              <div class="face-author">by ${escapeHtml(item.author || 'anon')}</div>
            </div>`;
        } else {
          layer.classList.add('layer-face');
          layer.style.transform = `translateZ(${zOff}px) rotateY(180deg)`;
          layer.innerHTML = `
            <div class="back-blur"><img src="${item.url}" alt="" draggable="false"/></div>
            <div class="back-dim"></div>
            <div class="back-stripe"></div>
            <div class="back-info">
              <div class="face-title">${escapeHtml(item.title || 'Untitled')}</div>
              <div class="face-author">@${escapeHtml(item.author || 'anon')}</div>
              <div class="back-tags">
                <span>${escapeHtml(item.mode || 'Showcase')}</span>
                <span>Steam</span>
                ${item.likes ? `<span>♥ ${item.likes}</span>` : ''}
              </div>
            </div>`;
        }
        card.appendChild(layer);
      });

      // Invisible hit layer — 3D cards with pointer-events:none children don't receive clicks otherwise
      const hit = document.createElement('div');
      hit.className = 'card-hit';
      hit.style.cssText = 'position:absolute;inset:0;z-index:20;border-radius:16px;cursor:pointer;pointer-events:auto;background:transparent;transform:translateZ(2px);';
      card.appendChild(hit);

      hit.addEventListener('mouseenter', () => { paused = true; });
      hit.addEventListener('mouseleave', () => { if (!dragging) paused = false; });
      hit.addEventListener('pointerup', (e) => {
        if (e.button != null && e.button !== 0) return;
        const moved = Math.hypot((e.clientX || 0) - dragStartX, (e.clientY || 0) - (window._dragStartY || 0));
        if (moved > 10) return;
        e.preventDefault();
        e.stopPropagation();
        openModal(item);
      });
      // also click as fallback
      hit.addEventListener('click', (e) => {
        const moved = Math.hypot((e.clientX || 0) - dragStartX, (e.clientY || 0) - (window._dragStartY || 0));
        if (moved > 10) return;
        e.preventDefault();
        e.stopPropagation();
        openModal(item);
      });

      root.appendChild(card);
      cards.push(card);
    });

    stageInner.appendChild(root);
  }

  function buildFeed() {
    feedGrid.innerHTML = items.map((item) => `
      <article class="feed-card" data-id="${item.id}">
        <img src="${item.url}" alt="${escapeHtml(item.title)}" loading="lazy"/>
        <div class="info">
          <div class="t">${escapeHtml(item.title || 'Untitled')}</div>
          <div class="a">by ${escapeHtml(item.author || 'anon')}</div>
          <div class="stats">
            <span>♥ ${item.likes || 0}</span>
            <span>${escapeHtml(item.mode || '')}</span>
          </div>
        </div>
      </article>
    `).join('');
    $$('.feed-card', feedGrid).forEach((el) => {
      el.addEventListener('click', () => {
        const it = items.find((x) => String(x.id) === el.dataset.id);
        if (it) openModal(it);
      });
    });
  }

  // HORIZONTAL cylinder math
  function renderLoop() {
    if (!paused && !dragging && viewMode === 'carousel') {
      progress += 0.0014;
    }

    const w = window.innerWidth;
    const { cardW } = metrics;
    const roundedIndex = Math.round(progress);
    const diffFromRound = progress - roundedIndex;
    const easedDiff = Math.sign(diffFromRound) * Math.pow(Math.abs(diffFromRound) * 2, 4.0) / 2;
    const virtualActiveIndex = roundedIndex + easedDiff;
    const halfCount = Math.max(cardCount / 2, 1);
    const gap = 36;
    const peekAmount = -40;
    const D = 1400;

    for (let i = 0; i < cardCount; i++) {
      const card = cards[i];
      if (!card) continue;

      let offset = i - virtualActiveIndex;
      while (offset > halfCount) offset -= cardCount;
      while (offset < -halfCount) offset += cardCount;

      const absOffset = Math.abs(offset);
      const sign = Math.sign(offset) || 1;

      if (absOffset > 3) {
        card.style.visibility = 'hidden';
        continue;
      }
      card.style.visibility = 'visible';

      let x = 0, z = 0, rot = 0;

      if (absOffset <= 1) {
        const t = absOffset;
        const e = t * t * (3 - 2 * t);
        x = sign * (e * (cardW + gap));
        z = 380 + e * (200 - 380);
        rot = e * 55; // yaw for horizontal feel
      } else if (absOffset <= 2) {
        const t = absOffset - 1;
        const e = t * t * (3 - 2 * t);
        const xStart = cardW + gap, zStart = 200, rotStart = 55;
        const zEnd = -40, rotEnd = 75;
        const sEnd = D / (D - zEnd);
        const xEnd = (w / 2 - peekAmount) / sEnd - cardW / 2;
        x = sign * (xStart + e * (xEnd - xStart));
        z = zStart + e * (zEnd - zStart);
        rot = rotStart + e * (rotEnd - rotStart);
      } else {
        const t = Math.min(absOffset - 2, 1);
        const e = t * t * (3 - 2 * t);
        const zStart = -40, rotStart = 75, zEnd3 = -220, rotEnd3 = 90;
        const s2 = D / (D - zStart);
        const x2 = (w / 2 - peekAmount) / s2 - cardW / 2;
        const s3 = D / (D - zEnd3);
        const x3 = (w / 2 + 80) / s3 + cardW / 2;
        x = sign * (x2 + e * (x3 - x2));
        z = zStart + e * (zEnd3 - zStart);
        rot = rotStart + e * (rotEnd3 - rotStart);
      }

      card.style.zIndex = String(Math.round(z));
      card.style.transform =
        `translateX(${x.toFixed(2)}px) translateZ(${z.toFixed(2)}px) ` +
        `rotateY(${(-sign * rot).toFixed(2)}deg)`;
    }

    raf = requestAnimationFrame(renderLoop);
  }

  function startLoop() {
    if (!raf && viewMode === 'carousel' && cardCount) {
      raf = requestAnimationFrame(renderLoop);
    }
  }
  function stopLoop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }


  // wheel → horizontal progress
  stage.addEventListener('wheel', (e) => {
    if (viewMode !== 'carousel') return;
    e.preventDefault();
    progress += e.deltaY * 0.0018 + e.deltaX * 0.0018;
  }, { passive: false });

  // drag
  let dragMoved = false;
  window._dragStartY = 0;
  stage.addEventListener('pointerdown', (e) => {
    if (viewMode !== 'carousel') return;
    dragging = true;
    dragMoved = false;
    paused = true;
    dragStartX = e.clientX;
    window._dragStartY = e.clientY;
    dragStartProgress = progress;
    // do NOT capture pointer immediately — otherwise card click never fires
  });
  stage.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - (window._dragStartY || 0);
    if (Math.hypot(dx, dy) > 6) {
      dragMoved = true;
      try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    }
    progress = dragStartProgress - dx * 0.0045;
  });
  stage.addEventListener('pointerup', () => {
    dragging = false;
    paused = false;
  });
  stage.addEventListener('pointercancel', () => {
    dragging = false;
    paused = false;
  });

  window.addEventListener('resize', resize);

  // ===== Modal =====
  const modalBg = $('#modalBg');
  function openModal(item) {
    currentItem = item;
    $('#mImg').src = item.url;
    $('#mTitle').textContent = item.title || 'Untitled';
    $('#mMode').textContent = item.mode || 'Showcase';
    $('#mLikes').textContent = item.likes || 0;
    $('#mLike').classList.toggle('liked', !!item.liked);

    const author = item.author || 'anon';
    const profileUrl = item.profile_url || (item.username ? '/profile/' + encodeURIComponent(item.username) : '#');
    $('#mAuthor').textContent = author;
    $('#mAuthor').href = profileUrl;
    $('#mSub').textContent = item.username ? '@' + item.username : '';
    const av = $('#mAv');
    av.href = profileUrl;
    if (item.avatar_url) {
      av.innerHTML = `<img src="${item.avatar_url}" alt=""/>`;
    } else {
      av.textContent = (author[0] || '?').toUpperCase();
    }

    loadComments(item.id);
    modalBg.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    modalBg.classList.remove('open');
    document.body.style.overflow = '';
    currentItem = null;
  }
  $('#mClose').addEventListener('click', closeModal);
  modalBg.addEventListener('click', (e) => { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  async function loadComments(id) {
    const box = $('#mComments');
    box.innerHTML = '<div class="comment-empty">Загрузка…</div>';
    try {
      const r = await fetch(`/api/gallery/${id}/comments`, { credentials: 'include' });
      const d = await r.json();
      const list = d.comments || d.items || [];
      if (!list.length) {
        box.innerHTML = '<div class="comment-empty">Пока нет комментариев</div>';
        return;
      }
      box.innerHTML = list.map((c) => `
        <div class="comment">
          <div class="c-author">${escapeHtml(c.author || c.display_name || 'anon')}</div>
          <div class="c-text">${escapeHtml(c.text || c.body || '')}</div>
        </div>
      `).join('');
    } catch {
      box.innerHTML = '<div class="comment-empty">Не удалось загрузить</div>';
    }
  }

  $('#mLike').addEventListener('click', async () => {
    if (!currentItem) return;
    try {
      const r = await fetch(`/api/gallery/${currentItem.id}/like`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      });
      const d = await r.json();
      if (d.ok || d.likes != null) {
        currentItem.likes = d.likes != null ? d.likes : (currentItem.likes || 0) + (d.liked ? 1 : -1);
        currentItem.liked = !!d.liked;
        $('#mLikes').textContent = currentItem.likes;
        $('#mLike').classList.toggle('liked', currentItem.liked);
      }
    } catch {}
  });

  $('#mCommentSend').addEventListener('click', async () => {
    if (!currentItem) return;
    const input = $('#mCommentInput');
    const text = (input.value || '').trim();
    if (!text) return;
    try {
      const r = await fetch(`/api/gallery/${currentItem.id}/comments`, {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const d = await r.json();
      if (d.ok !== false) {
        input.value = '';
        loadComments(currentItem.id);
      } else {
        alert(d.msg || 'Войдите, чтобы комментировать');
      }
    } catch {
      alert('Ошибка отправки');
    }
  });

  async function load() {
    try {
      const r = await fetch('/api/gallery/list?status=approved&limit=40', { credentials: 'include' });
      const d = await r.json();
      const list = d.items || d.gallery || [];
      items = list.map((it) => ({
        id: it.id,
        title: it.title || 'Untitled',
        author: it.author || it.username || 'anon',
        username: it.username || '',
        profile_url: it.profile_url || (it.username ? '/profile/' + encodeURIComponent(it.username) : '#'),
        avatar_url: it.avatar_url || '',
        mode: it.mode || 'Showcase',
        url: it.url || (it.id ? '/api/gallery/image/' + it.id : ''),
        likes: it.likes || 0,
        liked: !!it.liked,
      })).filter((x) => x.url);

      if (!items.length) {
        items = [
          { id: 1, title: 'Neon Dreams', author: 'n1t1337', username: 'n1t1337', mode: 'Workshop', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80', likes: 12, profile_url: '#' },
          { id: 2, title: 'Cherry Soft', author: 'momo', username: 'momo', mode: 'Featured', url: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=800&q=80', likes: 8, profile_url: '#' },
          { id: 3, title: 'Cyber Alley', author: 'void', username: 'void', mode: 'Workshop', url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&q=80', likes: 21, profile_url: '#' },
          { id: 4, title: 'Soft Light', author: 'pixel', username: 'pixel', mode: 'Artwork Split', url: 'https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=800&q=80', likes: 5, profile_url: '#' },
          { id: 5, title: 'Rainy Night', author: 'frame', username: 'frame', mode: 'Workshop', url: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80', likes: 14, profile_url: '#' },
        ];
      }

      cardCount = items.length;
      loadingEl.style.display = 'none';
      resize();
      buildCarousel();
      buildFeed();
      startLoop();
    } catch (e) {
      console.error(e);
      loadingEl.innerHTML = '<div>Не удалось загрузить галерею</div>';
    }
  }

  load();
})();
</script>
