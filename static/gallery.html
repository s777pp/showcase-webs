<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0c0c;
  --panel:#121212;
  --border:rgba(255,255,255,.1);
  --muted:rgba(255,255,255,.55);
  --accent:#00d2ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Mulish,system-ui,sans-serif;overflow:hidden}
a{color:inherit;text-decoration:none}

/* ===== Header (как на главной / gallery) ===== */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  backdrop-filter:blur(14px);
  background:rgba(12,12,12,.88);
  border-bottom:1px solid var(--border);
}
.nav{
  max-width:72rem;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.logo-link{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;display:block;border-radius:8px;object-fit:cover}
.nav-links{display:none;gap:28px;align-items:center}
@media(min-width:768px){.nav-links{display:flex}}
.nav-links a{
  color:rgba(255,255,255,.7);font-size:14px;font-weight:500;
  transition:color .2s;white-space:nowrap;
}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-pill{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;
  white-space:nowrap;transition:background .2s;
}
.btn-pill:hover{background:rgba(255,255,255,.14)}
.btn-shiny-nav{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 14px;border-radius:999px;border:1px solid rgba(164,244,253,.4);
  font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;
  background-image:linear-gradient(to right,#091020 0%,#0B2551 12.5%,#A4F4FD 32.5%,#00d2ff 50%,#0B2551 67.5%,#091020 87.5%,#091020 100%);
  background-size:200% auto;-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;animation:shiny 6s linear infinite;
  border:none;font-family:inherit;
}
@keyframes shiny{0%{background-position:-200% center}100%{background-position:200% center}}

/* mobile menu */
.logo-menu-btn{
  display:flex;align-items:center;gap:8px;
  background:none;border:none;color:#fff;cursor:pointer;padding:0;
  font-family:inherit;font-size:13px;
}
@media(min-width:768px){.logo-menu-btn{display:none}}
.logo-menu-btn img{width:28px;height:28px;border-radius:7px}
.mobile-menu{
  display:none;position:absolute;top:calc(100% + 8px);left:0;
  min-width:180px;background:rgba(18,18,18,.98);border:1px solid var(--border);
  border-radius:14px;padding:8px;z-index:80;box-shadow:0 16px 48px rgba(0,0,0,.5);
}
.mobile-menu.open{display:block}
.mobile-menu a,.mobile-menu button{
  display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;
  color:rgba(255,255,255,.8);font-size:14px;background:none;border:none;
  font-family:inherit;cursor:pointer;
}
.mobile-menu a:hover,.mobile-menu button:hover{background:rgba(255,255,255,.06);color:#fff}
.mm-sep{height:1px;background:var(--border);margin:6px 0}

/* ===== Stage ===== */
.stage{
  position:fixed;inset:0;top:60px;
  background:#000;
  overflow:hidden;
}
.stage-inner{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  perspective:1350px;
}
.card-root{
  position:absolute;
  transform-style:preserve-3d;
}
.card{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  will-change:transform;
}
.layer{
  position:absolute;inset:0;
  border-radius:16px;
  overflow:hidden;
  pointer-events:none;
}
.layer-mid{
  background:#141414;
  border:1px solid rgba(255,255,255,.08);
}
.layer-face{
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.1);
  backface-visibility:hidden;
}
.layer-face img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.face-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.78) 0%,transparent 45%,rgba(0,0,0,.28) 100%);
}
.face-logo{
  position:absolute;top:14px;left:14px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);
  display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;
  backdrop-filter:blur(6px);
}
.face-badge{
  position:absolute;top:14px;right:14px;
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  padding:4px 10px;border-radius:999px;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.82);
}
.face-meta{
  position:absolute;left:0;right:0;bottom:0;padding:16px;
}
.face-title{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face-author{font-size:11px;color:rgba(255,255,255,.48);margin-top:2px}

.back-blur img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;transform:scale(1.12);filter:blur(18px);
}
.back-dim{position:absolute;inset:0;background:rgba(0,0,0,.58)}
.back-stripe{position:absolute;top:20px;left:0;right:0;height:28px;background:rgba(0,0,0,.85)}
.back-info{
  position:absolute;left:0;right:0;bottom:0;padding:18px;
  display:flex;flex-direction:column;gap:6px;
}
.back-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.back-tags span{
  font-size:10px;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.7);
}

/* states */
.loading,.empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:var(--muted);font-size:14px;z-index:5;
}
.spinner{
  width:28px;height:28px;border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:50;font-size:12px;color:rgba(255,255,255,.35);
  pointer-events:none;letter-spacing:.02em;
}
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="/" class="logo-link" aria-label="Showcase Maker">
      <img class="logo-mark" src="/static/icon.png" alt="" width="32" height="32"
           onerror="this.style.display='none'"/>
    </a>

    <div style="position:relative">
      <button type="button" class="logo-menu-btn" id="logoMenuBtn" aria-expanded="false">
        <img src="/static/icon.png" alt="" onerror="this.style.display='none'"/>
        <span>Menu</span>
      </button>
      <div class="mobile-menu" id="mobileMenu">
        <a href="/">Home</a>
        <a href="/gallery">Gallery</a>
        <a href="/profile">Profile</a>
        <a href="/app">Tools</a>
        <div class="mm-sep"></div>
        <a href="/app">Open tools →</a>
      </div>
    </div>

    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/gallery" class="active">Gallery</a>
      <a href="/profile">Profile</a>
      <a href="/app">Tools</a>
    </div>

    <div class="nav-right">
      <a class="btn-shiny-nav" href="/app" id="navReg">Open tools</a>
      <a class="btn-pill" href="/app">Open tools →</a>
    </div>
  </nav>
</header>

<div class="stage" id="stage">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Загрузка галереи…</div>
  </div>
  <div class="empty" id="empty" style="display:none">
    <div>Пока нет работ</div>
    <a class="btn-pill" href="/app" style="margin-top:8px">Создать первую →</a>
  </div>
  <div class="stage-inner" id="stageInner" style="display:none"></div>
</div>

<div class="hint">Наведи курсор — пауза · двигай мышью — параллакс</div>

<script>
(function () {
  // mobile menu
  const btn = document.getElementById('logoMenuBtn');
  const menu = document.getElementById('mobileMenu');
  if (btn && menu) {
    btn.addEventListener('click', () => {
      const open = menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if (!btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  const stage = document.getElementById('stage');
  const stageInner = document.getElementById('stageInner');
  const loadingEl = document.getElementById('loading');
  const emptyEl = document.getElementById('empty');

  let items = [];
  let cardCount = 0;
  let cards = [];
  let metrics = { cardW: 300, cardH: 400 };
  let progress = 0;
  let paused = false;
  const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
  let raf = 0;

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight - 60;
    let cardW = Math.round(Math.min(320, Math.max(170, w * 0.2)));
    const hf = Math.min(1, Math.max(0.65, h / 850));
    cardW = Math.round(cardW * hf);
    metrics = { cardW, cardH: Math.round(cardW * 1.33) };
    // update root size
    const root = stageInner.querySelector('.card-root');
    if (root) {
      root.style.width = metrics.cardW + 'px';
      root.style.height = metrics.cardH + 'px';
    }
    cards.forEach(c => {
      if (!c) return;
      c.style.width = metrics.cardW + 'px';
      c.style.height = metrics.cardH + 'px';
    });
  }

  function buildCards() {
    stageInner.innerHTML = '';
    cards = [];
    const root = document.createElement('div');
    root.className = 'card-root';
    root.style.width = metrics.cardW + 'px';
    root.style.height = metrics.cardH + 'px';
    root.style.transformStyle = 'preserve-3d';

    const thickness = [-1.35, -0.67, 0, 0.67, 1.35];

    items.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.width = metrics.cardW + 'px';
      card.style.height = metrics.cardH + 'px';
      card.style.transformStyle = 'preserve-3d';

      thickness.forEach((zOff, li) => {
        const isFront = li === thickness.length - 1;
        const isBack = li === 0;
        const layer = document.createElement('div');
        layer.className = 'layer';

        if (!isFront && !isBack) {
          layer.classList.add('layer-mid');
          layer.style.transform = `translateZ(${zOff}px)`;
        } else if (isFront) {
          layer.classList.add('layer-face');
          layer.style.transform = `translateZ(${zOff}px)`;
          layer.innerHTML = `
            <img src="${item.url}" alt="${escapeHtml(item.title)}" draggable="false" loading="lazy"
                 onerror="this.src='data:image/svg+xml,${encodeURIComponent('<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"500\"><rect fill=\"#1a1a1a\" width=\"100%\" height=\"100%\"/><text x=\"50%\" y=\"50%\" fill=\"#444\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"18\">No image</text></svg>')}'"/>
            <div class="face-grad"></div>
            <div class="face-logo">S</div>
            <div class="face-badge">${escapeHtml(item.mode || 'Showcase')}</div>
            <div class="face-meta">
              <div class="face-title">${escapeHtml(item.title || 'Untitled')}</div>
              <div class="face-author">by ${escapeHtml(item.author || 'anon')}</div>
            </div>
          `;
        } else if (isBack) {
          layer.classList.add('layer-face');
          layer.style.transform = `translateZ(${zOff}px) rotateY(180deg)`;
          layer.innerHTML = `
            <div class="back-blur"><img src="${item.url}" alt="" draggable="false"/></div>
            <div class="back-dim"></div>
            <div class="back-stripe"></div>
            <div class="back-info">
              <div class="face-title">${escapeHtml(item.title || 'Untitled')}</div>
              <div class="face-author">@${escapeHtml(item.author || 'anon')}</div>
              <div class="back-tags">
                <span>${escapeHtml(item.mode || 'Showcase')}</span>
                <span>Steam</span>
                ${item.likes ? `<span>♥ ${item.likes}</span>` : ''}
              </div>
            </div>
          `;
        }
        card.appendChild(layer);
      });

      root.appendChild(card);
      cards.push(card);
    });

    stageInner.appendChild(root);
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderLoop() {
    if (!paused) progress += 0.00135;

    mouse.x += (mouse.targetX - mouse.x) * 0.08;
    mouse.y += (mouse.targetY - mouse.y) * 0.08;

    const h = window.innerHeight - 60;
    const { cardH } = metrics;
    const roundedIndex = Math.round(progress);
    const diffFromRound = progress - roundedIndex;
    const easedDiff = Math.sign(diffFromRound) * Math.pow(Math.abs(diffFromRound) * 2, 4.2) / 2;
    const virtualActiveIndex = roundedIndex + easedDiff;
    const halfCount = cardCount / 2;
    const gap = 40;
    const peekAmount = -48;
    const D = 1350;

    for (let i = 0; i < cardCount; i++) {
      const card = cards[i];
      if (!card) continue;

      let offset = i - virtualActiveIndex;
      while (offset > halfCount) offset -= cardCount;
      while (offset < -halfCount) offset += cardCount;

      const absOffset = Math.abs(offset);
      const sign = Math.sign(offset) || 1;

      if (absOffset > 3) {
        card.style.visibility = 'hidden';
        continue;
      }
      card.style.visibility = 'visible';

      let y = 0, z = 0, rot = 0;

      if (absOffset <= 1) {
        const t = absOffset;
        const e = t * t * (3 - 2 * t);
        y = -sign * (e * (cardH + gap));
        z = 400 + e * (220 - 400);
        rot = e * 128;
      } else if (absOffset <= 2) {
        const t = absOffset - 1;
        const e = t * t * (3 - 2 * t);
        const yStart = cardH + gap, zStart = 220, rotStart = 128;
        const zEnd = -50, rotEnd = 172;
        const sEnd = D / (D - zEnd);
        const yEnd = (h / 2 - peekAmount) / sEnd - cardH / 2;
        y = -sign * (yStart + e * (yEnd - yStart));
        z = zStart + e * (zEnd - zStart);
        rot = rotStart + e * (rotEnd - rotStart);
      } else {
        const t = Math.min(absOffset - 2, 1);
        const e = t * t * (3 - 2 * t);
        const zStart = -50, rotStart = 172, zEnd3 = -240, rotEnd3 = 195;
        const s2 = D / (D - zStart);
        const y2 = (h / 2 - peekAmount) / s2 - cardH / 2;
        const s3 = D / (D - zEnd3);
        const y3 = (h / 2 + 90) / s3 + cardH / 2;
        y = -sign * (y2 + e * (y3 - y2));
        z = zStart + e * (zEnd3 - zStart);
        rot = rotStart + e * (rotEnd3 - rotStart);
      }

      const center = Math.max(0, 1 - absOffset);
      const tiltX = -mouse.y * 11 * center;
      const tiltY = mouse.x * 14 * center;

      card.style.zIndex = String(Math.round(z));
      card.style.transform =
        `translateY(${y.toFixed(2)}px) translateZ(${z.toFixed(2)}px) ` +
        `rotateX(${(-sign * rot + tiltX).toFixed(2)}deg) ` +
        `rotateY(${tiltY.toFixed(2)}deg) rotateZ(-2.5deg)`;
    }

    raf = requestAnimationFrame(renderLoop);
  }

  // mouse
  window.addEventListener('mousemove', (e) => {
    const rx = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
    const ry = (e.clientY - (window.innerHeight + 60) / 2) / ((window.innerHeight - 60) / 2);
    mouse.targetX = Math.max(-1, Math.min(1, rx));
    mouse.targetY = Math.max(-1, Math.min(1, ry));
  });
  document.addEventListener('mouseleave', () => {
    mouse.targetX = 0;
    mouse.targetY = 0;
  });

  // pause on hover over stage
  stage.addEventListener('mouseenter', () => { paused = true; });
  stage.addEventListener('mouseleave', () => { paused = false; });

  window.addEventListener('resize', resize);

  async function load() {
    try {
      const r = await fetch('/api/gallery/list?status=approved&limit=24', { credentials: 'include' });
      const d = await r.json();
      const list = (d.items || d.gallery || d || []).filter(Boolean);

      items = list.map((it) => ({
        id: it.id,
        title: it.title || 'Untitled',
        author: it.author || it.username || 'anon',
        mode: it.mode || 'Showcase',
        url: it.url || (it.id ? `/api/gallery/image/${it.id}` : ''),
        likes: it.likes || 0,
      })).filter((x) => x.url);

      // fallback if API empty / offline — keep demo feel
      if (!items.length) {
        items = [
          { id: 1, title: 'Neon Dreams', author: 'n1t1337', mode: 'Workshop', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80', likes: 12 },
          { id: 2, title: 'Cherry Soft', author: 'momo', mode: 'Featured', url: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=800&q=80', likes: 8 },
          { id: 3, title: 'Cyber Alley', author: 'void', mode: 'Workshop', url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=800&q=80', likes: 21 },
          { id: 4, title: 'Soft Light', author: 'pixel', mode: 'Artwork Split', url: 'https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?w=800&q=80', likes: 5 },
          { id: 5, title: 'Rainy Night', author: 'frame', mode: 'Workshop', url: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80', likes: 14 },
        ];
      }

      cardCount = items.length;
      loadingEl.style.display = 'none';

      if (!cardCount) {
        emptyEl.style.display = 'flex';
        return;
      }

      stageInner.style.display = 'flex';
      resize();
      buildCards();
      raf = requestAnimationFrame(renderLoop);
    } catch (e) {
      console.error(e);
      loadingEl.innerHTML = '<div>Не удалось загрузить галерею</div>';
    }
  }

  load();
})();
</script>
</body>
</html>
