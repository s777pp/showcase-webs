<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Gallery · Showcase Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/ss.css?v=20260907-privacy"/>
<link rel="stylesheet" href="/static/css/gallery.css?v=20260902a"/>
  <link rel="stylesheet" href="/static/css/mobile.css?v=20260903m"/>
  <link rel="stylesheet" href="/static/css/redesign.css?v=20260903j"/>
<link rel="stylesheet" href="/static/css/creator-os.css?v=20260908-gallery-mobile"/>
<link rel="stylesheet" href="/static/css/layout-refinement.css?v=20260909-german1">
<script src="/static/js/layout-refinement.js?v=20260904c"></script>
<script src="/static/js/locales-extra.js?v=20260909-languages8"></script>
<script src="/static/js/i18n.js?v=20260909-languages4"></script>
<link rel="stylesheet" href="/static/css/support-chat.css?v=20260908-mobile-polish">
<script defer src="/static/js/support-chat.js?v=20260909-german1"></script>
</head>
<body class="page-gallery carousel-mode">

<div id="ssHeadHost"></div>

<header class="site-header" id="siteHeader">
  <nav class="nav">
    <a href="/" class="logo-link" aria-label="Showcase Maker">
      <img class="logo-mark" src="/static/icon.png" alt="" width="32" height="32" onerror="this.style.display='none'"/>
    </a>
    <div style="position:relative">
      <button type="button" class="logo-menu-btn" id="logoMenuBtn" aria-expanded="false">
        <img src="/static/icon.png" alt="" onerror="this.style.display='none'"/>
        <span data-i="nav_menu">Menu</span>
      </button>
      <div class="mobile-menu" id="mobileMenu">
        <a href="/" data-i="nav_home">Home</a>
        <a href="/gallery" data-i="nav_gallery">Gallery</a>
        <a href="/profile" data-i="nav_profile">Profile</a>
        <a href="/app" data-i="nav_tools">Tools</a>
        <div class="mm-sep"></div>
        <a href="/app" data-i="nav_open_tools">Open tools →</a>
      </div>
    </div>
    <div class="nav-links">
      <a href="/" data-i="nav_home">Home</a>
      <a href="/gallery" class="active" data-i="nav_gallery">Gallery</a>
      <a href="/profile" data-i="nav_profile">Profile</a>
      <a href="/app" data-i="nav_tools">Tools</a>
    </div>
    <div class="nav-right">
      <a class="btn-pill" href="/app" data-i="nav_open_tools">Open tools →</a>
    </div>
  </nav>
</header>

<div class="view-bar" id="viewBar">
  <button type="button" class="active" data-view="carousel" data-i="gal_carousel">Carousel</button>
  <button type="button" data-view="feed" data-i="gal_feed">Feed</button>
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div data-i="gal_loading">Loading the gallery…</div>
</div>

<div class="stage" id="stage">
  <div class="stage-inner" id="stageInner"></div>
</div>

<div class="feed" id="feed">
  <div class="feed-grid" id="feedGrid"></div>
</div>

<div class="hint" id="hint" data-i="gal_hint">Click a card · scroll or drag · hover to pause</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-img"><img id="mImg" src="" alt=""/></div>
    <div class="modal-side">
      <div class="modal-head">
        <a class="modal-av" id="mAv" href="#"></a>
        <div class="who">
          <a class="name" id="mAuthor" href="#"></a>
          <div class="sub" id="mSub"></div>
        </div>
        <button type="button" class="modal-close" id="mClose" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-mode" id="mMode"></div>
        <div class="modal-actions">
          <button type="button" class="like-btn" id="mLike">♥ <span id="mLikes">0</span></button>
        </div>
        <div class="comments" id="mComments"></div>
      </div>
      <div class="composer">
        <input id="mCommentInput" type="text" data-i-ph="gal_ph_comment" placeholder="Write a comment…" maxlength="500"/>
        <button type="button" id="mCommentSend" data-i="gal_send">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/gallery.js?v=20260906-i18n"></script>
<script src="/static/ss-shell.js?v=20260909-languages4"></script>
</body>
</html>
